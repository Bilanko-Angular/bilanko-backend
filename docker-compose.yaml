services:
  postgres:
    image: postgres:18
    container_name: bilanko-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: bilanko
      POSTGRES_USER: bilanko_user
      POSTGRES_PASSWORD: motdepasse_local
    ports:
      - "5432:5432"
    volumes:
      - bilanko_pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: bilanko-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bilanko.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  bilanko_pgdata:
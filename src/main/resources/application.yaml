server:
  port: ${PORT:8080}

spring:
  application:
    name: bilanko
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USER_MAIL}
    password: ${USER_MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: qwen/qwen2.5-vl-72b-instruct
jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION}
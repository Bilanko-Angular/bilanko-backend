server:
  port: ${PORT:8080}

spring:
  application:
    name: bilanko
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION}